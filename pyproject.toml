[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "service-sentinel"
version = "0.1.0"
description = "Service Sentinel health API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "mangum>=0.19,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
    "uvicorn>=0.52,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
